schema: spec-driven

context: |
  Monorepo: Rust UCI engine at repo root (2024, no third-party chess crates) plus Go Bubble Tea
  TUI under tui/ that talks UCI to the engine subprocess. Specs describe observable behavior
  (FEN, moves, perft, UCI, TUI panels); design holds implementation. Engine tests are named
  Rust #[test]s; TUI tests are Go/Bubble Tea tests. One OpenSpec change per capability.
  Square indexing: a1=0 … h8=63 (LERF). See openspec/project.md for full conventions.

rules:
  proposal:
    - Include Non-goals section
    - Keep scope to a single capability (one engine layer or the TUI client)
  specs:
    - Use Given/When/Then scenarios
    - Prefer concrete FEN strings, UCI lines, and numeric expectations
  design:
    - Document bitboard layout and square indexing when relevant to the engine
    - For TUI changes, document process/UCI boundaries and panel layout
  tasks:
    - Order tasks so tests can go red then green
    - End with validate (cargo test and/or go test as applicable) and openspec validate

operations:
  apply:
    guidance:
      - Implement tasks in order; mark checkboxes when done
      - Keep the Rust UCI binary as the engine entry; put Bubble Tea code under tui/
  archive:
    guidance:
      - Confirm relevant tests are green before archiving
